sonar.projectKey=devsecops-mobile-app

# Source code. Treat unit-test files as tests rather than production sources.
sonar.sources=.
sonar.tests=test,monitoring/telegram-notifier/tests,scripts/test-npm-audit-gate.js
sonar.exclusions=test/**,monitoring/telegram-notifier/tests/**,scripts/test-npm-audit-gate.js,coverage/**

# Python notifier coverage.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12

# JavaScript risk-based npm audit gate coverage (Node.js 22 built-in LCOV reporter).
# JavaScript coverage: npm audit gate and application security tests.
sonar.javascript.lcov.reportPaths=coverage/npm-audit/lcov.info,coverage/security/lcov.info
