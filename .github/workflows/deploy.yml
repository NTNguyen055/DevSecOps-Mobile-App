name: Deploy Production

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Security Scan
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::900558045438:role/devsecops-github-actions-role
          aws-region: ap-southeast-1

      - name: Set deployment image
        id: deployment
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image=ntnguyen055/devsecops-mobile-app:latest" >> "$GITHUB_OUTPUT"
          else
            echo "image=ntnguyen055/devsecops-mobile-app:${WORKFLOW_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSM
        env:
          DEPLOY_IMAGE: ${{ steps.deployment.outputs.image }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0ca2b3a3d02304351 \
            --document-name AWS-RunShellScript \
            --parameters "commands=[
              \"set -e\",
              \"cd /home/ubuntu/app\",
              \"sudo -u ubuntu git fetch origin main\",
              \"sudo -u ubuntu git reset --hard origin/main\",
              \"DOCKER_IMAGE=${DEPLOY_IMAGE} docker compose --env-file .env.production pull\",
              \"DOCKER_IMAGE=${DEPLOY_IMAGE} docker compose --env-file .env.production up -d --wait\",
              \"sudo install -m 644 nginx/devsecops-api.conf /etc/nginx/sites-available/devsecops-api\",
              \"sudo ln -sfn /etc/nginx/sites-available/devsecops-api /etc/nginx/sites-enabled/devsecops-api\",
              \"sudo nginx -t\",
              \"sudo systemctl reload nginx\",
              \"docker compose --env-file .env.production ps\",
              \"curl --fail --silent --show-error http://127.0.0.1:4001/health/db\",
              \"curl --fail --silent --show-error http://devsecops-mobile.duckdns.org/health/db\"
            ]" \
            --comment "Deploy DevSecOps Mobile App to EC2" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0ca2b3a3d02304351 \
              --query 'Status' \
              --output text)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deployment failed"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0ca2b3a3d02304351
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment did not finish within the expected time"
          exit 1
