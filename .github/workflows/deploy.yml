name: Deploy to App AWS EC2

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Security Scan"]
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  EC2_INSTANCE_ID: i-0ca2b3a3d02304351
  DOCKER_IMAGE: ntnguyen055/devsecops-mobile-app
  DOMAIN: devsecops-mobile.duckdns.org

jobs:
  deploy:
    name: Deploy to EC2
    outputs:
      deploy_status: ${{ steps.deploy.outcome }}
      zap_status: ${{ steps.zap.outputs.status }}
      rollback_status: ${{ steps.rollback.outcome }}

    if: >
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::900558045438:role/devsecops-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine Docker image tag
        id: image
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image=${DOCKER_IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "image=${DOCKER_IMAGE}:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture previous production image
        id: previous
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Capture previous production image before deployment" \
            --parameters commands='[
              "cd /home/ubuntu/app",
              "PREVIOUS_IMAGE=$(docker inspect -f '\''{{.Config.Image}}'\'' devsecops-api 2>/dev/null || true)",
              "echo \"Previous image: ${PREVIOUS_IMAGE}\"",
              "if [ -z \"${PREVIOUS_IMAGE}\" ]; then echo \"ERROR: Previous production image not found.\"; exit 1; fi",
              "echo \"PREVIOUS_IMAGE=${PREVIOUS_IMAGE}\""
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text)

            echo "SSM status: ${STATUS}"

            case "${STATUS}" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "Failed to capture previous production image"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}"
                exit 1
                ;;
            esac

            sleep 5
          done

          if [ "${STATUS}" != "Success" ]; then
            echo "Previous image detection timed out"
            exit 1
          fi

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text)

          echo "${OUTPUT}"

          PREVIOUS_IMAGE=$(echo "${OUTPUT}" | grep '^PREVIOUS_IMAGE=' | tail -1 | cut -d'=' -f2-)

          if [ -z "${PREVIOUS_IMAGE}" ]; then
            echo "ERROR: Previous production image could not be determined."
            exit 1
          fi

          echo "Previous production image: ${PREVIOUS_IMAGE}"
          echo "previous_image=${PREVIOUS_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Deploy application via AWS SSM
        id: deploy
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy DevSecOps Mobile App" \
            --parameters commands='[
              "set -e",
              "export DOMAIN=${{ env.DOMAIN }}",
              "export DOCKER_IMAGE=${{ steps.image.outputs.image }}",

              "echo === Sync repository ===",
              "cd /home/ubuntu/app",
              "sudo -u ubuntu git fetch origin main",
              "sudo -u ubuntu git reset --hard origin/main",

              "echo === Pull Docker image ===",
              "docker compose --env-file .env.production pull",

              "echo === Start application ===",
              "docker compose --env-file .env.production up -d --wait",

              "echo === Check application container ===",
              "docker compose --env-file .env.production ps",

              "echo === Check local backend health ===",
              "curl --fail --silent --show-error http://127.0.0.1:4001/health/db",

              "echo === Install Nginx configuration ===",
              "sudo install -m 644 nginx/devsecops-api.conf /etc/nginx/sites-available/devsecops-api",
              "sudo ln -sfn /etc/nginx/sites-available/devsecops-api /etc/nginx/sites-enabled/devsecops-api",

              "echo === Verify TLS certificate ===",
              "sudo test -f /etc/letsencrypt/live/${DOMAIN}/fullchain.pem",
              "sudo test -f /etc/letsencrypt/live/${DOMAIN}/privkey.pem",

              "echo === Validate Nginx configuration ===",
              "sudo nginx -t",

              "echo === Reload Nginx ===",
              "sudo systemctl reload nginx",

              "echo === Check Nginx listeners ===",
              "sudo ss -lntp | grep -E \":80|:443\"",

              "echo === Check HTTPS health endpoint ===",
              "curl --fail --silent --show-error https://${DOMAIN}/health/db",

              "echo === Check HTTP to HTTPS redirect ===",
              "HTTP_STATUS=$(curl -s -o /dev/null -w \"%{http_code}\" http://${DOMAIN}/health/db)",
              "HTTP_LOCATION=$(curl -s -I http://${DOMAIN}/health/db | grep -i \"^location:\" | tr -d \"\\r\")",
              "echo \"HTTP status: ${HTTP_STATUS}\"",
              "echo \"HTTP location: ${HTTP_LOCATION}\"",
              "test \"${HTTP_STATUS}\" = \"301\"",
              "echo \"${HTTP_LOCATION}\" | grep -q \"https://${DOMAIN}/health/db\"",

              "echo === Deployment verification completed ==="
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text)

            echo "SSM status: ${STATUS}"

            case "${STATUS}" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deployment failed"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}"
                exit 1
                ;;
            esac

            sleep 5
          done

          if [ "${STATUS}" != "Success" ]; then
            echo "Deployment did not finish within the expected time"
            exit 1
          fi

          echo "=== SSM command output ==="

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text

          echo "=== SSM command error output ==="

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'StandardErrorContent' \
            --output text

          echo "Deployment completed successfully."

      - name: Run OWASP ZAP DAST
        id: zap
        shell: bash
        run: |
          set +e

          echo "=== Starting OWASP ZAP Baseline Scan ==="

          mkdir -p zap-reports
          chmod 777 zap-reports

          docker run --rm -t \
            -v "$(pwd)/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "https://${DOMAIN}" \
            -r zap-baseline-report.html \
            -J zap-baseline-report.json \
            -x zap-baseline-report.xml

          ZAP_STATUS=$?

          echo "ZAP exit code: ${ZAP_STATUS}"
          echo "status=${ZAP_STATUS}" >> "$GITHUB_OUTPUT"

          case "${ZAP_STATUS}" in
            0)
              echo "ZAP result: PASS"
              ;;
            1)
              echo "ZAP result: FAIL"
              ;;
            2)
              echo "ZAP result: WARN"
              ;;
            3)
              echo "ZAP result: SCAN ERROR"
              ;;
            *)
              echo "ZAP result: UNKNOWN"
              ;;
          esac

          exit 0

      - name: Upload OWASP ZAP reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: owasp-zap-dast-report
          path: |
            zap-reports/zap-baseline-report.html
            zap-reports/zap-baseline-report.json
            zap-reports/zap-baseline-report.xml
          if-no-files-found: error
          retention-days: 30

      - name: Evaluate OWASP ZAP result
        if: always() && steps.deploy.outcome == 'success'
        shell: bash
        run: |
          ZAP_STATUS="${{ steps.zap.outputs.status }}"

          echo "=== OWASP ZAP result ==="
          echo "Exit code: ${ZAP_STATUS}"

          case "${ZAP_STATUS}" in
            0)
              echo "PASS: Keep the new production release."
              ;;
            1)
              echo "FAIL: The new release must be rolled back."
              exit 1
              ;;
            2)
              echo "WARN: Keep the new production release."
              ;;
            3)
              echo "ERROR: ZAP scan could not be completed."
              exit 1
              ;;
            *)
              echo "ERROR: Unknown ZAP result."
              exit 1
              ;;
          esac

      - name: Rollback production deployment
        id: rollback
        if: always() && (steps.deploy.outcome == 'failure' || steps.zap.outputs.status == '1' || steps.zap.outputs.status == '3')
        shell: bash
        run: |
          PREVIOUS_IMAGE="${{ steps.previous.outputs.previous_image }}"

          echo "=== Starting automatic rollback ==="
          echo "Previous image: ${PREVIOUS_IMAGE}"

          if [ -z "${PREVIOUS_IMAGE}" ]; then
            echo "ERROR: Previous image is unavailable. Rollback cannot continue."
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Rollback DevSecOps Mobile App after CD failure" \
            --parameters commands='[
              "set -e",
              "cd /home/ubuntu/app",
              "export DOCKER_IMAGE='${PREVIOUS_IMAGE}'",
              "export DOMAIN='${DOMAIN}'",

              "echo === Pull previous Docker image ===",
              "docker pull ${DOCKER_IMAGE}",

              "echo === Restore previous production image ===",
              "docker compose --env-file .env.production up -d --wait",

              "echo === Check rollback container ===",
              "docker compose --env-file .env.production ps",

              "echo === Validate rollback health ===",
              "curl --fail --silent --show-error http://127.0.0.1:4001/health/db",

              "echo === Validate public HTTPS after rollback ===",
              "curl --fail --silent --show-error https://${DOMAIN}/health/db",

              "echo === Rollback verification completed ==="
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Rollback SSM Command ID: ${COMMAND_ID}"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text)

            echo "Rollback SSM status: ${STATUS}"

            case "${STATUS}" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "Rollback failed"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}"
                exit 1
                ;;
            esac

            sleep 5
          done

          if [ "${STATUS}" != "Success" ]; then
            echo "Rollback did not finish within the expected time"
            exit 1
          fi

          echo "=== Rollback SSM output ==="

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text

          echo "=== Rollback SSM error output ==="

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'StandardErrorContent' \
            --output text

          echo "Rollback completed successfully."

  telegram-notification:
    name: Telegram Deploy Notification
    needs:
      - deploy
    runs-on: ubuntu-latest

    if: >
      always() &&
      (
        (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success')
      )

    steps:
      - name: Determine Deploy status
        id: status
        shell: bash
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "status=PASSED" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
          fi

      - name: Download OWASP ZAP report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: owasp-zap-dast-report
          path: telegram-reports/zap

      - name: Send Deploy status to Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ steps.status.outputs.status }}
          COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          ROLLBACK_RESULT="${{ needs.deploy.outputs.rollback_status }}"

          if [ "$ROLLBACK_RESULT" = "skipped" ]; then
            ROLLBACK_RESULT="NOT REQUIRED"
          fi
          MESSAGE=$(cat <<EOF
          PRODUCTION DEPLOYMENT

          Status: ${DEPLOY_STATUS}

          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          Commit: ${COMMIT_SHA}
          Actor: ${GITHUB_ACTOR}

          ----------------------------------------

          DEPLOYMENT

          Deployment: ${DEPLOY_STATUS}

          ----------------------------------------

          OWASP ZAP

          Scan result: ${ZAP_RESULT}
          Exit code: ${ZAP_STATUS}

          ----------------------------------------

          ROLLBACK

          Status: ${ROLLBACK_STATUS}

          ----------------------------------------

          DAST REPORT

          zap-baseline-report.html

          ----------------------------------------

          GitHub Actions
          EOF
          )

          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "text=${MESSAGE}"

      - name: Send OWASP ZAP HTML report to Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          REPORT="telegram-reports/zap/zap-baseline-report.html"

          if [ -f "$REPORT" ]; then
            echo "Sending OWASP ZAP HTML report..."

            curl --fail --silent --show-error \
              --request POST \
              --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
              --form "document=@${REPORT}"
          else
            echo "OWASP ZAP HTML report not found."
          fi
