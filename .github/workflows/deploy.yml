name: Deploy to App AWS EC2

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Security Scan"]
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: devsecops-production-ec2
  cancel-in-progress: false
  queue: max

env:
  AWS_REGION: ap-southeast-1
  EC2_INSTANCE_ID: i-0ca2b3a3d02304351
  DOCKER_IMAGE: ntnguyen055/devsecops-mobile-app
  DOMAIN: devsecops-mobile.duckdns.org

jobs:
  release_gate:
    name: Verify Published Application Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}

    steps:
      - name: Check Docker Publish Result
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF: ${{ github.ref }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          SOURCE_RESULT: ${{ github.event.workflow_run.conclusion }}
          CURRENT_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::notice::Manual production deployment is disabled until the published image and Security Scan can be verified."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" != "workflow_run" ] ||
             [ "$SOURCE_EVENT" != "push" ] ||
             [ "$SOURCE_BRANCH" != "main" ] ||
             [ "$SOURCE_REPO" != "$GITHUB_REPOSITORY" ] ||
             [ "$SOURCE_RESULT" != "success" ]; then
            echo "Skipping: ineligible Security Scan run"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "Invalid source workflow run ID"
            exit 1
          }

          JOBS_JSON=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100&filter=latest")

          PUBLISH_RESULT=$(jq -r '
            [.jobs[] |
              select(.name == "Publish Docker Image") |
              .conclusion
            ] |
            if length == 1 then .[0] else "unknown" end
          ' <<< "$JOBS_JSON")

          echo "Docker Publish result: $PUBLISH_RESULT"

          if [ "$PUBLISH_RESULT" != "success" ]; then
            echo "Application Deployment skipped: no successful image publish"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_MAIN_SHA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/branches/main" \
            --jq '.commit.sha')

          if [ "$SOURCE_SHA" != "$LATEST_MAIN_SHA" ]; then
            echo "Skipping stale application release"
            echo "Release SHA: $SOURCE_SHA"
            echo "Latest main: $LATEST_MAIN_SHA"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "===== VERIFY APPLICATION CI ====="

          CI_VERIFIED=false

          for attempt in $(seq 1 120); do
            CI_RUNS_JSON=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SOURCE_SHA}&branch=main&event=push&per_page=100")

            CI_RUN_JSON=$(jq -c --arg sha "$SOURCE_SHA" '
              [.workflow_runs[] |
                select(
                  .head_sha == $sha and
                  .head_branch == "main" and
                  .event == "push"
                )
              ] |
              sort_by(.created_at, .id) |
              last // {}
            ' <<< "$CI_RUNS_JSON")

            CI_RUN_ID=$(jq -r '.id // empty' <<< "$CI_RUN_JSON")
            CI_STATUS=$(jq -r '.status // "missing"' <<< "$CI_RUN_JSON")
            CI_RESULT=$(jq -r '.conclusion // "pending"' <<< "$CI_RUN_JSON")

            echo "CI attempt ${attempt}: ${CI_STATUS} / ${CI_RESULT}"

            if [ "$CI_STATUS" = "completed" ]; then
              if [ "$CI_RESULT" != "success" ]; then
                echo "::error::Application CI did not pass"
                exit 1
              fi

              CI_JOBS_JSON=$(gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/jobs?per_page=100&filter=latest")

              for REQUIRED_JOB in \
                "Test (backend)" \
                "Lint (backend)" \
                "Lint (mobile client)"
              do
                JOB_RESULT=$(jq -r --arg name "$REQUIRED_JOB" '
                  [.jobs[] |
                    select(.name == $name) |
                    .conclusion
                  ] |
                  if length == 1 then .[0]
                  else "missing-or-duplicate" end
                ' <<< "$CI_JOBS_JSON")

                if [ "$JOB_RESULT" != "success" ]; then
                  echo "::error::Required CI job failed: ${REQUIRED_JOB}"
                  exit 1
                fi
              done

              CI_VERIFIED=true
              break
            fi

            sleep 10
          done

          if [ "$CI_VERIFIED" != "true" ]; then
            echo "::error::Application CI verification timed out"
            exit 1
          fi

          echo "APPLICATION CI GATE: PASS"

          echo "Release is current and Docker image was published"
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to EC2
    needs: release_gate
    outputs:
      deploy_status: ${{ steps.deploy.outcome }}
      zap_status: ${{ steps.zap.outputs.status }}
      rollback_status: ${{ steps.rollback.outcome }}

    if: needs.release_gate.outputs.should_deploy == 'true'

    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::900558045438:role/devsecops-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine Docker image tag
        id: image
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_SHA="${{ github.sha }}"
          else
            RELEASE_SHA="${{ github.event.workflow_run.head_sha }}"
          fi

          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid release commit SHA"
            exit 1
          fi

          echo "commit=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${DOCKER_IMAGE}:${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

          echo "Release commit: ${RELEASE_SHA}"
          echo "Release image: ${DOCKER_IMAGE}:${RELEASE_SHA}"

      - name: Verify Release Is Current Before EC2 Deployment
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.image.outputs.commit }}
        run: |
          set -euo pipefail

          echo "===== VERIFY RELEASE SHA ====="

          LATEST_MAIN_SHA=$(git ls-remote origin refs/heads/main | awk '{print $1}')

          if ! [[ "$LATEST_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to determine latest main commit"
            exit 1
          fi

          echo "Release SHA: ${RELEASE_SHA}"
          echo "Latest main: ${LATEST_MAIN_SHA}"

          if [ "$RELEASE_SHA" != "$LATEST_MAIN_SHA" ]; then
            echo "::error::Stale release detected. EC2 deployment aborted."
            exit 1
          fi

          echo "PRE-DEPLOYMENT SHA CHECK: PASS"

      - name: Capture previous production image
        id: previous
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Capture previous production image before deployment" \
            --parameters commands='[
              "set -e",
              "cd /home/ubuntu/app",

              "PREVIOUS_COMMIT=$(sudo -u ubuntu git rev-parse HEAD)",
              "echo \"PREVIOUS_COMMIT=${PREVIOUS_COMMIT}\"",

              "echo === Capture exact running image ID ===",
              "PREVIOUS_IMAGE_ID=$(docker inspect -f '\''{{.Image}}'\'' devsecops-api)",
              "docker image inspect \"${PREVIOUS_IMAGE_ID}\" >/dev/null",

              "echo === Preserve previous image locally ===",
              "PREVIOUS_IMAGE=ntnguyen055/devsecops-mobile-app:rollback-${PREVIOUS_COMMIT}",
              "docker image tag \"${PREVIOUS_IMAGE_ID}\" \"${PREVIOUS_IMAGE}\"",

              "echo \"PREVIOUS_IMAGE=${PREVIOUS_IMAGE}\"",
              "echo \"PREVIOUS_IMAGE_ID=${PREVIOUS_IMAGE_ID}\""
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text)

            echo "SSM status: ${STATUS}"

            case "${STATUS}" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "Failed to capture previous production image"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}"
                exit 1
                ;;
            esac

            sleep 5
          done

          if [ "${STATUS}" != "Success" ]; then
            echo "Previous image detection timed out"
            exit 1
          fi

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text)

          echo "${OUTPUT}"

          PREVIOUS_IMAGE=$(echo "${OUTPUT}" | grep '^PREVIOUS_IMAGE=' | tail -1 | cut -d'=' -f2-)

          if [ -z "${PREVIOUS_IMAGE}" ]; then
            echo "ERROR: Previous production image could not be determined."
            exit 1
          fi

          echo "Previous production image: ${PREVIOUS_IMAGE}"
          echo "previous_image=${PREVIOUS_IMAGE}" >> "$GITHUB_OUTPUT"

          PREVIOUS_COMMIT=$(printf '%s\n' "${OUTPUT}" | grep '^PREVIOUS_COMMIT=' | tail -1 | cut -d'=' -f2-)

          if ! [[ "${PREVIOUS_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Previous Git commit is invalid or unavailable."
            exit 1
          fi

          echo "Previous production commit: ${PREVIOUS_COMMIT}"
          echo "previous_commit=${PREVIOUS_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Deploy application via AWS SSM
        id: deploy
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy DevSecOps Mobile App" \
            --timeout-seconds 180 \
            --parameters '{"commands":[
              "set -e",
              "command -v flock >/dev/null",
              "exec 9>/var/lock/devsecops-production-deploy.lock",
              "flock -n 9 || { echo Deployment lock busy; exit 1; }",
              "export DOMAIN=${{ env.DOMAIN }}",
              "export DOCKER_IMAGE=${{ steps.image.outputs.image }}",
              "export RELEASE_COMMIT=${{ steps.image.outputs.commit }}",

              "echo === Sync repository to exact release commit ===",
              "cd /home/ubuntu/app",
              "sudo -u ubuntu git fetch origin main",

              "echo === Verify release commit ===",
              "sudo -u ubuntu git cat-file -e ${RELEASE_COMMIT}^{commit}",
              "sudo -u ubuntu git merge-base --is-ancestor ${RELEASE_COMMIT} origin/main",

              "echo === Checkout exact release revision ===",
              "sudo -u ubuntu git reset --hard ${RELEASE_COMMIT}",
              "test \"$(sudo -u ubuntu git rev-parse HEAD)\" = \"${RELEASE_COMMIT}\"",

              "echo === Pull Docker image ===",
              "docker compose --env-file .env.production pull",

              "echo === Prepare trusted RDS CA bundle ===",
              "CA_FILE=$(mktemp /tmp/devsecops-rds-ca.XXXXXXXX.pem)",
              "trap \"rm -f -- ${CA_FILE}\" EXIT",
              "curl --fail --silent --show-error --location --connect-timeout 5 --max-time 30 https://truststore.pki.rds.amazonaws.com/ap-southeast-1/ap-southeast-1-bundle.pem --output \"${CA_FILE}\"",
              "test -s \"${CA_FILE}\"",
              "grep -q -- \"-----BEGIN CERTIFICATE-----\" \"${CA_FILE}\"",
              "chmod 0644 \"${CA_FILE}\"",

              "echo === Verify release migration artifacts ===",
              "test -f scripts/apply-shared-brute-force-migration.js",
              "test -f db/migrations/001_shared_brute_force_state.sql",
              "docker image inspect \"${DOCKER_IMAGE}\" >/dev/null",

              "echo === Migration preflight without schema changes ===",
              "docker compose --env-file .env.production run --rm --no-deps -T --pull never -e RDS_CA_FILE=/run/rds-ca.pem -v \"${CA_FILE}:/run/rds-ca.pem:ro\" app node scripts/apply-shared-brute-force-migration.js --check-connection",

              "echo === Apply shared brute force schema migration ===",
              "docker compose --env-file .env.production run --rm --no-deps -T --pull never -e RDS_CA_FILE=/run/rds-ca.pem -v \"${CA_FILE}:/run/rds-ca.pem:ro\" app node scripts/apply-shared-brute-force-migration.js",

              "echo === Migration successful ===",

              "echo === Start application ===",
              "docker compose --env-file .env.production up -d --wait",

              "echo === Check application container ===",
              "docker compose --env-file .env.production ps",

              "echo === Check Replica 1 health ===",
              "curl --fail --silent --show-error http://127.0.0.1:4001/health/db",

              "echo === Check Replica 2 health ===",
              "curl --fail --silent --show-error http://127.0.0.1:4002/health/db",

              "echo === Install Nginx configuration ===",
              "sudo install -m 644 nginx/devsecops-api.conf /etc/nginx/sites-available/devsecops-api",
              "sudo ln -sfn /etc/nginx/sites-available/devsecops-api /etc/nginx/sites-enabled/devsecops-api",

              "echo === Verify TLS certificate ===",
              "sudo test -f /etc/letsencrypt/live/${DOMAIN}/fullchain.pem",
              "sudo test -f /etc/letsencrypt/live/${DOMAIN}/privkey.pem",

              "echo === Validate Nginx configuration ===",
              "sudo nginx -t",

              "echo === Reload Nginx ===",
              "sudo systemctl reload nginx",

              "echo === Check Nginx listeners ===",
              "sudo ss -lntp | grep -E \":80|:443\"",

              "echo === Check HTTPS health endpoint ===",
              "curl --fail --silent --show-error https://${DOMAIN}/health/db",

              "echo === Check HTTP to HTTPS redirect ===",
              "HTTP_STATUS=$(curl -s -o /dev/null -w \"%{http_code}\" http://${DOMAIN}/health/db)",
              "HTTP_LOCATION=$(curl -s -I http://${DOMAIN}/health/db | grep -i \"^location:\" | tr -d \"\\r\")",
              "echo \"HTTP status: ${HTTP_STATUS}\"",
              "echo \"HTTP location: ${HTTP_LOCATION}\"",
              "test \"${HTTP_STATUS}\" = \"301\"",
              "echo \"${HTTP_LOCATION}\" | grep -q \"https://${DOMAIN}/health/db\"",

              "echo === Deployment verification completed ==="
            ],"executionTimeout":["900"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

          STATUS="Unknown"

          for i in {1..120}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null) || STATUS="Unknown"

            echo "Deployment SSM attempt ${i}: ${STATUS}"

            case "${STATUS}" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deployment SSM reached failure status"
                break
                ;;
              Pending|InProgress|Delayed|Cancelling|Unknown)
                ;;
              *)
                echo "Unrecognized SSM status: ${STATUS}"
                ;;
            esac

            sleep 10
          done

          if [ "${STATUS}" != "Success" ]; then
            echo "Deployment did not complete successfully."
            echo "Final observed status: ${STATUS}"

            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              || true

            exit 1
          fi

          echo "=== SSM command output ==="

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text

          echo "=== SSM command error output ==="

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'StandardErrorContent' \
            --output text

          echo "Deployment completed successfully."

      - name: Run OWASP ZAP DAST
        id: zap
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Starting OWASP ZAP Baseline Scan ==="

          mkdir -p zap-reports
          chmod 777 zap-reports

          test -s .zap/baseline.conf

          cp .zap/baseline.conf zap-reports/baseline.conf

          set +e

          docker run --rm -t \
            -v "$(pwd)/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "https://${DOMAIN}" \
            -c baseline.conf \
            -r zap-baseline-report.html \
            -J zap-baseline-report.json \
            -x zap-baseline-report.xml

          ZAP_STATUS=$?
          set -e

          echo "ZAP exit code: ${ZAP_STATUS}"
          echo "status=${ZAP_STATUS}" >> "$GITHUB_OUTPUT"

          case "${ZAP_STATUS}" in
            0)
              echo "ZAP result: PASS"
              ;;
            1)
              echo "ZAP result: FAIL"
              ;;
            2)
              echo "ZAP result: WARN"
              ;;
            3)
              echo "ZAP result: SCAN ERROR"
              ;;
            *)
              echo "ZAP result: UNKNOWN"
              ;;
          esac

          exit 0

      - name: Upload OWASP ZAP reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: owasp-zap-dast-report
          path: |
            zap-reports/zap-baseline-report.html
            zap-reports/zap-baseline-report.json
            zap-reports/zap-baseline-report.xml
          if-no-files-found: error
          retention-days: 30

      - name: Evaluate OWASP ZAP result
        id: evaluate_zap
        if: always() && steps.deploy.outcome == 'success'
        shell: bash
        run: |
          ZAP_STATUS="${{ steps.zap.outputs.status }}"

          echo "=== OWASP ZAP result ==="
          echo "Exit code: ${ZAP_STATUS}"

          case "${ZAP_STATUS}" in
            0)
              echo "PASS: Keep the new production release."
              ;;
            1)
              echo "FAIL: The new release must be rolled back."
              exit 1
              ;;
            2)
              echo "WARN: Keep the new production release."
              ;;
            3)
              echo "ERROR: ZAP scan could not be completed."
              exit 1
              ;;
            *)
              echo "ERROR: Unknown ZAP result."
              exit 1
              ;;
          esac

      - name: Rollback production deployment
        id: rollback
        if: always() && (steps.deploy.outcome == 'failure' || steps.evaluate_zap.outcome == 'failure')
        shell: bash
        run: |
          PREVIOUS_IMAGE="${{ steps.previous.outputs.previous_image }}"
          PREVIOUS_COMMIT="${{ steps.previous.outputs.previous_commit }}"

          echo "=== Starting automatic rollback ==="
          echo "Previous image: ${PREVIOUS_IMAGE}"

          if [ -z "${PREVIOUS_IMAGE}" ]; then
            echo "ERROR: Previous image is unavailable. Rollback cannot continue."
            exit 1
          fi

          if ! [[ "${PREVIOUS_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Previous Git commit is invalid or unavailable."
            exit 1
          fi

          echo "Previous production commit: ${PREVIOUS_COMMIT}"

          DEPLOY_COMMAND_ID="${{ steps.deploy.outputs.command_id }}"

          if [ -z "${DEPLOY_COMMAND_ID}" ]; then
            echo "BLOCKED: Deployment SSM Command ID is unavailable."
            echo "Manual Production verification is required."
            exit 1
          fi

          echo "===== VERIFY DEPLOYMENT SSM IS FINISHED ====="

          if ! DEPLOY_STATUS=$(aws ssm get-command-invocation \
            --command-id "${DEPLOY_COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'Status' \
            --output text); then
            echo "BLOCKED: Cannot verify deployment SSM status."
            exit 1
          fi

          echo "Deployment SSM status: ${DEPLOY_STATUS}"

          case "${DEPLOY_STATUS}" in
            Success|Failed)
              echo "Deployment command reached a terminal state."
              ;;
            *)
              echo "BLOCKED: Automatic rollback is unsafe."
              echo "Inspect SSM and EC2 before manual recovery."
              exit 1
              ;;
          esac

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Rollback DevSecOps Mobile App after CD failure" \
            --timeout-seconds 180 \
            --parameters '{"commands":[
              "set -e",
              "command -v flock >/dev/null",
              "exec 9>/var/lock/devsecops-production-deploy.lock",
              "flock -n 9 || { echo Deployment lock busy; exit 1; }",
              "cd /home/ubuntu/app",
              "export DOCKER_IMAGE='${PREVIOUS_IMAGE}'",
              "export DOMAIN='${DOMAIN}'",

              "echo === Verify previous Git commit ===",
              "sudo -u ubuntu git cat-file -e '${PREVIOUS_COMMIT}^{commit}'",

              "echo === Restore previous repository revision ===",
              "sudo -u ubuntu git reset --hard '${PREVIOUS_COMMIT}'",

              "echo === Verify preserved rollback image ===",
              "docker image inspect ${DOCKER_IMAGE} >/dev/null",

              "echo === Restore previous Nginx configuration ===",
              "sudo test -f nginx/devsecops-api.conf",
              "sudo install -m 644 nginx/devsecops-api.conf /etc/nginx/sites-available/devsecops-api",
              "sudo ln -sfn /etc/nginx/sites-available/devsecops-api /etc/nginx/sites-enabled/devsecops-api",

              "echo === Validate restored Nginx configuration ===",
              "sudo nginx -t",

              "echo === Reload restored Nginx configuration ===",
              "sudo systemctl reload nginx",

              "echo === Restore previous image and remove orphaned replicas ===",
              "docker compose --env-file .env.production up -d --wait --remove-orphans --pull never",

              "echo === Verify restored services ===",
              "docker compose --env-file .env.production ps",

              "echo === Validate rollback API health ===",
              "curl --fail --silent --show-error http://127.0.0.1:4001/health/db",

              "echo === Validate public HTTPS after rollback ===",
              "curl --fail --silent --show-error https://${DOMAIN}/health/db",

              "echo === Rollback verification completed ==="

            ],"executionTimeout":["900"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "Rollback SSM Command ID: ${COMMAND_ID}"

          STATUS="Unknown"

          for i in {1..120}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null) || STATUS="Unknown"

            echo "Rollback SSM attempt ${i}: ${STATUS}"

            case "${STATUS}" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "Rollback SSM reached failure status"
                break
                ;;
              Pending|InProgress|Delayed|Cancelling|Unknown)
                ;;
              *)
                echo "Unrecognized SSM status: ${STATUS}"
                ;;
            esac

            sleep 10
          done

          if [ "${STATUS}" != "Success" ]; then
            echo "Rollback did not complete successfully."
            echo "Final observed status: ${STATUS}"

            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              || true

            exit 1
          fi

          echo "=== Rollback SSM output ==="

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text

          echo "=== Rollback SSM error output ==="

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'StandardErrorContent' \
            --output text

          echo "Rollback completed successfully."

  telegram-notification:
    name: Telegram Deploy Notification
    needs:
      - release_gate
      - deploy
    runs-on: ubuntu-24.04

    if: >
      always() &&
      needs.release_gate.outputs.should_deploy == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success')
      )

    steps:
      - name: Determine Deploy status
        id: status
        shell: bash
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "status=PASSED" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
          fi

      - name: Download OWASP ZAP report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: owasp-zap-dast-report
          path: telegram-reports/zap

      - name: Summarize OWASP ZAP report
        id: zap_summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path(
              "telegram-reports/zap/zap-baseline-report.json"
          )

          summary = "UNAVAILABLE (JSON report missing or invalid)"

          try:
              data = json.loads(
                  report.read_text(encoding="utf-8")
              )

              sites = data["site"]

              if isinstance(sites, dict):
                  sites = [sites]

              if not isinstance(sites, list):
                  raise ValueError("Invalid ZAP site format")

              counts = {
                  "0": 0,
                  "1": 0,
                  "2": 0,
                  "3": 0
              }

              for site in sites:
                  for alert in site.get("alerts", []):
                      severity = str(alert["riskcode"])
                      counts[severity] += 1

              summary = (
                  f"High: {counts['3']} | "
                  f"Medium: {counts['2']} | "
                  f"Low: {counts['1']} | "
                  f"Informational: {counts['0']}"
              )

          except (OSError, ValueError, TypeError,
                  KeyError, AttributeError) as error:
              print("Unable to summarize ZAP report:", error)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:
              print(f"summary={summary}", file=output)

          print("ZAP findings:", summary)
          PY

      - name: Send Deploy status to Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ steps.status.outputs.status }}
          COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          ZAP_STATUS: ${{ needs.deploy.outputs.zap_status }}
          ROLLBACK_STATUS: ${{ needs.deploy.outputs.rollback_status }}
          ZAP_SUMMARY: ${{ steps.zap_summary.outputs.summary }}
        run: |
          # Determine OWASP ZAP scan result
          case "${ZAP_STATUS:-}" in
            0)
              ZAP_RESULT="PASS"
              ;;
            1)
              ZAP_RESULT="FAIL"
              ;;
            2)
              ZAP_RESULT="WARN"
              ;;
            3)
              ZAP_RESULT="SCAN ERROR"
              ;;
            "")
              ZAP_RESULT="NOT RUN"
              ZAP_STATUS="N/A"
              ;;
            *)
              ZAP_RESULT="UNKNOWN"
              ;;
          esac

          # Determine rollback result
          case "${ROLLBACK_STATUS:-}" in
            success)
              ROLLBACK_STATUS="SUCCESS"
              ;;
            failure)
              ROLLBACK_STATUS="FAILED"
              ;;
            skipped)
              if [ "${DEPLOY_STATUS}" = "PASSED" ]; then
                ROLLBACK_STATUS="NOT REQUIRED"
              else
                ROLLBACK_STATUS="NOT EXECUTED"
              fi
              ;;
            cancelled)
              ROLLBACK_STATUS="CANCELLED"
              ;;
            *)
              ROLLBACK_STATUS="UNKNOWN"
              ;;
          esac

          ZAP_SUMMARY="${ZAP_SUMMARY:-UNAVAILABLE}"

          MESSAGE=$(cat <<EOF
          PRODUCTION DEPLOYMENT

          Status: ${DEPLOY_STATUS}

          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          Commit: ${COMMIT_SHA}
          Actor: ${GITHUB_ACTOR}

          ----------------------------------------

          DEPLOYMENT

          Deployment: ${DEPLOY_STATUS}

          ----------------------------------------

          OWASP ZAP

          Scan result: ${ZAP_RESULT}
          Exit code: ${ZAP_STATUS}
          Findings: ${ZAP_SUMMARY}

          ----------------------------------------

          ROLLBACK

          Status: ${ROLLBACK_STATUS}

          ----------------------------------------

          DAST REPORT

          zap-baseline-report.html

          ----------------------------------------

          GitHub Actions
          EOF
          )

          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "text=${MESSAGE}"

      - name: Send OWASP ZAP HTML report to Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          REPORT="telegram-reports/zap/zap-baseline-report.html"

          if [ -f "$REPORT" ]; then
            echo "Sending OWASP ZAP HTML report..."

            curl --fail --silent --show-error \
              --request POST \
              --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
              --form "document=@${REPORT}"
          else
            echo "OWASP ZAP HTML report not found."
          fi
