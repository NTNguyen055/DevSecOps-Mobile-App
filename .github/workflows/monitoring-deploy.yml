name: Deploy Monitoring to AWS EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'monitoring/**'
      - '.github/workflows/monitoring-deploy.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: monitoring-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  EC2_INSTANCE_ID: i-0ca2b3a3d02304351
  MONITORING_DIR: /home/ubuntu/monitoring

jobs:
  deploy:
    name: Deploy Monitoring Stack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::900558045438:role/devsecops-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate monitoring files
        run: |
          set -euo pipefail

          # Validate required configuration files
          test -f monitoring/docker-compose.yml
          test -f monitoring/prometheus/prometheus.yml
          test -d monitoring/prometheus/rules
          test -f monitoring/blackbox/blackbox.yml
          test -f monitoring/alertmanager/alertmanager.yml

          # Validate Telegram Notifier source files
          test -f monitoring/telegram-notifier/app.py
          test -f monitoring/telegram-notifier/Dockerfile
          test -f monitoring/telegram-notifier/requirements.txt
          test -f monitoring/deploy/prepare-webhook-secret.sh
          bash -n monitoring/deploy/prepare-webhook-secret.sh

          test -f monitoring/deploy/validate-monitoring-release.sh
          bash -n monitoring/deploy/validate-monitoring-release.sh

          test -f monitoring/deploy/verify-monitoring-health.sh
          bash -n monitoring/deploy/verify-monitoring-health.sh

          test -f monitoring/deploy/verify-production-baseline.sh
          bash -n monitoring/deploy/verify-production-baseline.sh

          test -f monitoring/deploy/deploy-monitoring-release.sh
          bash -n monitoring/deploy/deploy-monitoring-release.sh

          # Temporary placeholder for Compose validation only
          mkdir -p monitoring/secrets

          SECRET_FILE="monitoring/secrets/monitoring_webhook_token"

          trap 'rm -f "$SECRET_FILE"' EXIT

          printf '%s' 'ci-compose-validation-only' > "$SECRET_FILE"

          docker compose \
            -f monitoring/docker-compose.yml \
            config -q

          echo "Monitoring configuration validation passed"

      - name: Package monitoring deployment bundle
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="$RUNNER_TEMP/monitoring-deploy.tar.gz"

          tar -czf "$BUNDLE" -C monitoring \
            docker-compose.yml \
            prometheus/prometheus.yml \
            prometheus/rules \
            blackbox/blackbox.yml \
            alertmanager/alertmanager.yml \
            telegram-notifier/app.py \
            telegram-notifier/Dockerfile \
            telegram-notifier/requirements.txt \
            deploy/prepare-webhook-secret.sh \
            deploy/validate-monitoring-release.sh \
            deploy/verify-monitoring-health.sh \
            deploy/verify-production-baseline.sh \
            deploy/deploy-monitoring-release.sh

          test -s "$BUNDLE"

          echo "Deployment bundle contents:"
          tar -tzf "$BUNDLE"

          echo "Bundle SHA256:"
          sha256sum "$BUNDLE"

          echo "Compressed size (bytes):"
          wc -c < "$BUNDLE"

          echo "Base64 size (bytes):"
          base64 -w 0 "$BUNDLE" | wc -c

      - name: Prepare SSM deployment parameters
        run: |
          set -euo pipefail

          # Read the monitoring bundle generated by the previous step
          BUNDLE="$RUNNER_TEMP/monitoring-deploy.tar.gz"

          if [ ! -s "$BUNDLE" ]; then
            echo "ERROR: Monitoring deployment bundle is missing"
            exit 1
          fi

          # Prepare bundle data for AWS SSM
          BUNDLE_B64=$(base64 -w 0 "$BUNDLE")
          BUNDLE_SHA256=$(sha256sum "$BUNDLE" | cut -d ' ' -f1)

          # Verify Base64 round-trip integrity
          ACTUAL_SHA256=$(
            printf '%s' "$BUNDLE_B64" |
              base64 -d |
              sha256sum |
              cut -d ' ' -f1
          )

          if [ "$BUNDLE_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "ERROR: Monitoring bundle integrity check failed"
            exit 1
          fi

          echo "Monitoring bundle prepared successfully"
          echo "SHA256: $BUNDLE_SHA256"
          echo "Base64 size: ${#BUNDLE_B64} bytes"

          # Prepare SSM commands for validation and controlled deployment.
          # Production changes happen only after staging preflight succeeds.
          jq -n \
            --arg bundle "$BUNDLE_B64" \
            --arg sha256 "$BUNDLE_SHA256" \
            --arg dir "$MONITORING_DIR" \
            '{
              executionTimeout: ["1800"],
              commands: [
                "set -eu",
                "umask 077",

                "STAGE_DIR=$(mktemp -d /tmp/monitoring-stage.XXXXXXXX)",
                "trap '\''rm -rf \"$STAGE_DIR\"'\'' EXIT",

                ("printf %s " + ($bundle | @sh) + " | base64 -d > \"$STAGE_DIR/bundle.tar.gz\""),

                ("EXPECTED_SHA256=" + ($sha256 | @sh)),
                "ACTUAL_SHA256=$(sha256sum \"$STAGE_DIR/bundle.tar.gz\" | cut -d \" \" -f1)",
                "test \"$EXPECTED_SHA256\" = \"$ACTUAL_SHA256\"",

                "mkdir -p \"$STAGE_DIR/files\"",
                "tar -xzf \"$STAGE_DIR/bundle.tar.gz\" -C \"$STAGE_DIR/files\"",

                "test -f \"$STAGE_DIR/files/docker-compose.yml\"",
                "test -f \"$STAGE_DIR/files/prometheus/prometheus.yml\"",
                "test -f \"$STAGE_DIR/files/prometheus/rules/application-alerts.yml\"",
                "test -f \"$STAGE_DIR/files/blackbox/blackbox.yml\"",
                "test -f \"$STAGE_DIR/files/alertmanager/alertmanager.yml\"",
                "test -f \"$STAGE_DIR/files/telegram-notifier/app.py\"",
                "test -f \"$STAGE_DIR/files/telegram-notifier/Dockerfile\"",
                "test -f \"$STAGE_DIR/files/telegram-notifier/requirements.txt\"",
                "test -f \"$STAGE_DIR/files/deploy/prepare-webhook-secret.sh\"",
                "bash -n \"$STAGE_DIR/files/deploy/prepare-webhook-secret.sh\"",

                "test -f \"$STAGE_DIR/files/deploy/validate-monitoring-release.sh\"",
                "bash -n \"$STAGE_DIR/files/deploy/validate-monitoring-release.sh\"",

                "test -f \"$STAGE_DIR/files/deploy/verify-monitoring-health.sh\"",
                "bash -n \"$STAGE_DIR/files/deploy/verify-monitoring-health.sh\"",

                "test -f \"$STAGE_DIR/files/deploy/verify-production-baseline.sh\"",
                "bash -n \"$STAGE_DIR/files/deploy/verify-production-baseline.sh\"",

                "test -f \"$STAGE_DIR/files/deploy/deploy-monitoring-release.sh\"",
                "bash -n \"$STAGE_DIR/files/deploy/deploy-monitoring-release.sh\"",

                "MONITORING_SECRET_FILE=\"$STAGE_DIR/files/secrets/monitoring_webhook_token\" bash \"$STAGE_DIR/files/deploy/prepare-webhook-secret.sh\"",
                "test -s \"$STAGE_DIR/files/secrets/monitoring_webhook_token\"",

                "test \"$(stat -c %u:%g:%a \"$STAGE_DIR/files/secrets/monitoring_webhook_token\")\" = \"0:24000:440\"",

                "bash \"$STAGE_DIR/files/deploy/validate-monitoring-release.sh\" \"$STAGE_DIR/files\"",

                ("MONITORING_DIR=" + ($dir | @sh) + " bash \"$STAGE_DIR/files/deploy/deploy-monitoring-release.sh\" \"$STAGE_DIR/files\""),

                "echo \"Monitoring deployment and health verification PASSED\""

              ]
            }' > ssm-parameters.json

          jq -e '.commands | type == "array" and length > 0' \
            ssm-parameters.json > /dev/null

          echo "SSM parameters prepared successfully"

      - name: Deploy monitoring configuration to EC2
        id: deploy
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy monitoring stack from GitHub Actions" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for SSM deployment and report result
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"
          STATUS="Pending"

          # SSM command execution timeout is 30 minutes; allow 35 minutes to collect final status.
          for attempt in $(seq 1 210); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null) || STATUS="Pending"

            echo "SSM attempt $attempt: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut)
                break
                ;;
              Pending|InProgress|Delayed|Cancelling)
                sleep 10
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "Final SSM deployment status: $STATUS"

          # Collect logs even when deployment fails.
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{
              Status: Status,
              Output: StandardOutputContent,
              Error: StandardErrorContent
            }' \
            --output json || true

          if [ "$STATUS" != "Success" ]; then
            echo "ERROR: Monitoring deployment did not succeed"
            exit 1
          fi

          echo "SSM MONITORING DEPLOYMENT PASSED"
