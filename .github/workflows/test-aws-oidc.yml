name: Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Debug GitHub OIDC claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          TOKEN=$(curl -sSf \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null || true)

          echo "OIDC claims:"
          echo "$PAYLOAD" | jq '{iss, sub, aud, repository, repository_owner, ref}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::900558045438:role/devsecops-github-actions-role
          aws-region: ap-southeast-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Test SSM command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0ca2b3a3d02304351 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["echo GitHub Actions OIDC + SSM works"]' \
            --region ap-southeast-1 \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0ca2b3a3d02304351 \
            --region ap-southeast-1

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0ca2b3a3d02304351 \
            --region ap-southeast-1