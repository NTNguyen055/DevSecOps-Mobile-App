name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    name: Test (backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_ecommerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_ecommerce_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 4001
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_ecommerce_db
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CLIENT_ORIGIN: '*'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install backend deps
        run: npm ci

      - name: Apply DB schema
        run: npm run db:schema

      - name: Start backend
        run: npm start > server.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:4001/health/db; then
              exit 0
            fi

            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

          echo "Backend did not become ready within 60 seconds"
          exit 1
      - name: Run backend tests
        run: npm test

      - name: Show backend logs on failure
        if: failure()
        run: cat server.log

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install backend deps
        run: npm ci

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: npm audit (backend)
        run: npm audit --audit-level=high

      - name: npm audit (client)
        run: npm audit --audit-level=high
        working-directory: client