name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        run: npm ci
        working-directory: client

      - name: Run eslint
        run: npm run lint
        working-directory: client

  test:
    name: Test (backend)
    runs-on: ubuntu-latest

    # Postgres chạy như service container trong chính job CI,
    # không cần AWS/RDS thật cho bước test này.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_ecommerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_ecommerce_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 4001
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_ecommerce_db
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CLIENT_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install backend deps
        run: npm ci

      - name: Apply DB schema
        run: npm run db:schema

      - name: Run tests
        run: npm test

  build:
    name: Build client
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build (backend deps + client build)
        run: npm run build