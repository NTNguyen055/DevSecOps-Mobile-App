name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          echo "Changed files:"
          git diff --name-only "$BASE" "$HEAD"

          if git diff --name-only "$BASE" "$HEAD" | grep -qvE '^monitoring/|^\.github/workflows/monitoring-'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test (backend)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_ecommerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_ecommerce_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      security-test-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lb_test
          POSTGRES_PASSWORD: lb_test_password_only_local
          POSTGRES_DB: lb_test_db
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U lb_test -d lb_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 4001
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_ecommerce_db
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CLIENT_ORIGIN: '*'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install backend deps
        run: npm ci --no-audit

      - name: Apply DB schema
        run: npm run db:schema

      - name: Apply shared detector migration to backend CI database
        run: |
          docker run --rm --network host -i \
            -e PGPASSWORD=ci_password \
            postgres:16-alpine \
            psql -X -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 \
              -p 5432 \
              -U ci_user \
              -d ci_ecommerce_db \
            < db/migrations/001_shared_brute_force_state.sql

      - name: Start backend
        run: npm start > server.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:4001/health/db; then
              exit 0
            fi

            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

          echo "Backend did not become ready within 60 seconds"
          exit 1

      - name: Run backend tests
        run: npm test

      - name: Apply shared detector integration migration
        run: |
          docker run --rm --network host -i \
            -e PGPASSWORD=lb_test_password_only_local \
            postgres:16-alpine \
            psql -X -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 \
              -p 55432 \
              -U lb_test \
              -d lb_test_db \
            < db/migrations/001_shared_brute_force_state.sql

      - name: Run shared detector integration tests
        env:
          DATABASE_URL: postgresql://lb_test:lb_test_password_only_local@127.0.0.1:55432/lb_test_db
        run: npx --no-install mocha --exit test/integration/*.integration.js

      - name: Show backend logs on failure
        if: failure()
        run: cat server.log

  lint:
    name: Lint (backend)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install backend deps
        run: npm ci --no-audit

      - name: Run backend lint
        run: npm run lint

      - name: Validate Production Nginx Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "===== PREPARE TEST TLS CERTIFICATE ====="

          TLS_DIR=$(mktemp -d)
          trap 'rm -rf "$TLS_DIR"' EXIT

          openssl req \
            -x509 \
            -nodes \
            -newkey rsa:2048 \
            -days 1 \
            -keyout "$TLS_DIR/privkey.pem" \
            -out "$TLS_DIR/fullchain.pem" \
            -subj "/CN=devsecops-mobile.duckdns.org" \
            >/dev/null 2>&1

          test -s "$TLS_DIR/privkey.pem"
          test -s "$TLS_DIR/fullchain.pem"

          echo "===== VALIDATE NGINX CONFIGURATION ====="

          docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE}/nginx/devsecops-api.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            --mount "type=bind,source=${TLS_DIR},target=/etc/letsencrypt/live/devsecops-mobile.duckdns.org,readonly" \
            --entrypoint nginx \
            nginx:stable-alpine \
            -t

          echo "NGINX PRODUCTION CONFIG: PASS"

  lint-client:
    name: Lint (mobile client)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install mobile client deps
        working-directory: client
        run: npm ci --no-audit

      - name: Run mobile client lint
        working-directory: client
        run: npm run lint

  telegram-notification:
    name: Telegram CI Notification
    needs:
      - changes
      - test
      - lint
      - lint-client
    runs-on: ubuntu-24.04
    if: >
      always() &&
      needs.changes.outputs.app == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Determine CI status
        id: status
        run: |
          if [[ "${{ needs.test.result }}" == "failure" || \
                "${{ needs.test.result }}" == "cancelled" || \
                "${{ needs.lint.result }}" == "failure" || \
                "${{ needs.lint.result }}" == "cancelled" || \
                "${{ needs.lint-client.result }}" == "failure" || \
                "${{ needs.lint-client.result }}" == "cancelled" ]]; then
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
          else
            echo "status=PASSED" >> "$GITHUB_OUTPUT"
          fi

      - name: Send CI status to Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CI_STATUS: ${{ steps.status.outputs.status }}
        run: |
          MESSAGE=$(cat <<EOF
          CI PIPELINE

          Status: ${CI_STATUS}

          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          Actor: ${GITHUB_ACTOR}

          ----------------------------------------

          RESULTS

          Backend tests: ${{ needs.test.result }}
          Backend lint: ${{ needs.lint.result }}
          Mobile client lint: ${{ needs.lint-client.result }}

          ----------------------------------------

          GitHub Actions
          EOF
          )

          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "text=${MESSAGE}"