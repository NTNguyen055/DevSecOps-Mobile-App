name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    name: Test (backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_ecommerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_ecommerce_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 4001
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_ecommerce_db
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CLIENT_ORIGIN: '*'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install backend deps
        run: npm ci --no-audit

      - name: Apply DB schema
        run: npm run db:schema

      - name: Start backend
        run: npm start > server.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:4001/health/db; then
              exit 0
            fi

            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

          echo "Backend did not become ready within 60 seconds"
          exit 1

      - name: Run backend tests
        run: npm test

      - name: Show backend logs on failure
        if: failure()
        run: cat server.log

  lint:
    name: Lint (backend)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install backend deps
        run: npm ci --no-audit

      - name: Run backend lint
        run: npm run lint

  lint-client:
    name: Lint (mobile client)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install mobile client deps
        working-directory: client
        run: npm ci --no-audit

      - name: Run mobile client lint
        working-directory: client
        run: npm run lint

  telegram-notification:
    name: Telegram CI Notification
    needs:
      - test
      - lint
      - lint-client
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Determine CI status
        id: status
        run: |
          if [[ "${{ needs.test.result }}" == "failure" || \
                "${{ needs.test.result }}" == "cancelled" || \
                "${{ needs.lint.result }}" == "failure" || \
                "${{ needs.lint.result }}" == "cancelled" || \
                "${{ needs.lint-client.result }}" == "failure" || \
                "${{ needs.lint-client.result }}" == "cancelled" ]]; then
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
          else
            echo "status=PASSED" >> "$GITHUB_OUTPUT"
          fi

      - name: Send CI status to Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CI_STATUS: ${{ steps.status.outputs.status }}
        run: |
          MESSAGE=$(cat <<EOF
          🔧 CI Pipeline
          Status: ${CI_STATUS}
          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          Actor: ${GITHUB_ACTOR}
          Results:
          • Backend tests: ${{ needs.test.result }}
          • Backend lint: ${{ needs.lint.result }}
          • Mobile client lint: ${{ needs.lint-client.result }}
          EOF
          )

          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "text=${MESSAGE}"