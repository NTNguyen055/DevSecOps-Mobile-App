name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test:
    name: Test (backend)
    runs-on: ubuntu-latest

    # Postgres service container for running tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_ecommerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_ecommerce_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 4001
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_ecommerce_db
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CLIENT_ORIGIN: '*'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install backend deps
        run: npm ci

      - name: Apply DB schema
        run: npm run db:schema

      - name: Run backend tests
        run: npm test

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: npm audit (backend)
        run: npm audit --audit-level=high

      - name: npm audit (client)
        run: npm audit --audit-level=high
        working-directory: client