name: Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Quét lại toàn bộ mỗi thứ Hai 03:00 UTC để bắt CVE mới phát hiện sau này
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write # cần để upload SARIF lên tab Security

jobs:
  gitleaks:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # quét cả git history, không chỉ commit hiện tại

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: Dependency scan (Trivy filesystem)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-fs'

  trivy-docker:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Build image duy nhất một lần.
      # Image này sẽ được scan và sau đó publish.
      - name: Build Docker image
        run: |
          docker build \
            -t ntnguyen055/devsecops-mobile-app:${{ github.sha }} \
            .

      # Scan chính image vừa build.
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ntnguyen055/devsecops-mobile-app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # Upload kết quả scan lên GitHub Security.
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image'

      # Chỉ lưu image nếu security scan PASS.
      # Publish job sẽ sử dụng chính image artifact này.
      - name: Save Docker image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: |
          docker save \
            ntnguyen055/devsecops-mobile-app:${{ github.sha }} \
            | gzip > docker-image.tar.gz

      - name: Upload Docker image artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: docker-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: Publish Docker Image
    needs:
      - gitleaks
      - trivy-fs
      - trivy-docker
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v6

      # Tải chính Docker image đã được Trivy scan.
      - name: Download scanned Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.sha }}

      # Load image vào Docker của publish runner.
      - name: Load scanned Docker image
        run: |
          gunzip -c docker-image.tar.gz | docker load

      - name: Set Docker tag
        id: docker-tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Retag chính image đã được scan.
      # Không build lại image.
      - name: Tag scanned Docker image
        run: |
          docker tag \
            ntnguyen055/devsecops-mobile-app:${{ github.sha }} \
            ntnguyen055/devsecops-mobile-app:${{ steps.docker-tag.outputs.tag }}

      # Push chính image đã được Trivy scan.
      - name: Push Docker image
        run: |
          docker push ntnguyen055/devsecops-mobile-app:${{ steps.docker-tag.outputs.tag }}
          docker push ntnguyen055/devsecops-mobile-app:${{ github.sha }}