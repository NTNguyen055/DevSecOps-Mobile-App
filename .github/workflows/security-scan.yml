name: Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Quét lại toàn bộ mỗi thứ Hai 03:00 UTC để bắt CVE mới phát hiện sau này
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write # cần để upload SARIF lên tab Security

jobs:
  gitleaks:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # quét cả git history, không chỉ commit hiện tại

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: Dependency scan (Trivy filesystem)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-fs'

      - name: Generate Trivy HTML report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'template'
          template: '@$HOME/.local/bin/trivy-bin/contrib/html.tpl'
          output: 'trivy-fs-report.html'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy filesystem HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-fs-report
          path: trivy-fs-report.html
          if-no-files-found: error
          retention-days: 30

  trivy-docker:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Build image duy nhất một lần.
      # Image này sẽ được scan và sau đó publish.
      - name: Build Docker image
        run: |
          docker build \
            -t ntnguyen055/devsecops-mobile-app:${{ github.sha }} \
            .

      # Scan chính image vừa build.
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ntnguyen055/devsecops-mobile-app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # Upload kết quả scan lên GitHub Security.
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image'

      - name: Generate Trivy image HTML report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ntnguyen055/devsecops-mobile-app:${{ github.sha }}'
          format: 'template'
          template: '@$HOME/.local/bin/trivy-bin/contrib/html.tpl'
          output: 'trivy-image-report.html'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy image HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-report
          path: trivy-image-report.html
          if-no-files-found: error
          retention-days: 30

      # Chỉ lưu image nếu security scan PASS.
      # Publish job sẽ sử dụng chính image artifact này.
      - name: Save Docker image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        run: |
          docker save \
            ntnguyen055/devsecops-mobile-app:${{ github.sha }} \
            | gzip > docker-image.tar.gz

      - name: Upload Docker image artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ github.sha }}
          path: docker-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  npm-audit:
    name: Software Composition Analysis (npm audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Backend / API dependencies
      - name: Install backend dependencies
        run: npm ci --no-audit

      - name: Audit backend dependencies
        id: audit-backend
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Generate backend npm audit HTML report
        if: always()
        continue-on-error: true
        run: |
          npm audit --json > npm-audit-backend.json || true

          npx --yes audit-export \
            --path . \
            --title "Backend npm Audit Report" \
            < npm-audit-backend.json

          mv audit-report.html npm-audit-backend.html

      - name: Upload backend npm audit HTML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-backend-report
          path: npm-audit-backend.html
          if-no-files-found: error
          retention-days: 30

      # Mobile client dependencies
      - name: Install mobile client dependencies
        working-directory: client
        run: npm ci --no-audit

      - name: Audit mobile client dependencies
        id: audit-client
        continue-on-error: true
        working-directory: client
        run: npm audit --audit-level=high

      - name: Generate mobile client npm audit HTML report
        if: always()
        continue-on-error: true
        working-directory: client
        run: |
          npm audit --json > npm-audit-client.json || true

          npx --yes audit-export \
            --path . \
            --title "Mobile Client npm Audit Report" \
            < npm-audit-client.json

          mv audit-report.html npm-audit-client.html

      - name: Upload mobile client npm audit HTML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-client-report
          path: client/npm-audit-client.html
          if-no-files-found: error
          retention-days: 30

      - name: Enforce npm audit security gate
        if: always()
        run: |
          if [ "${{ steps.audit-backend.outcome }}" = "failure" ] || \
             [ "${{ steps.audit-client.outcome }}" = "failure" ]; then
            echo "npm audit security gate failed"
            exit 1
          fi

          echo "npm audit security gate passed"
  sonarqube:
    name: SAST (SonarQube)
    runs-on: [self-hosted, Linux, X64, devsecops-tooling]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker-publish:
    name: Publish Docker Image
    needs:
      - gitleaks
      - trivy-fs
      - trivy-docker
      - npm-audit
      - sonarqube
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v6

      # Tải chính Docker image đã được Trivy scan.
      - name: Download scanned Docker image
        uses: actions/download-artifact@v8
        with:
          name: docker-image-${{ github.sha }}

      # Load image vào Docker của publish runner.
      - name: Load scanned Docker image
        run: |
          gunzip -c docker-image.tar.gz | docker load

      - name: Set Docker tag
        id: docker-tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Retag chính image đã được scan.
      # Không build lại image.
      - name: Tag scanned Docker image
        run: |
          docker tag \
            ntnguyen055/devsecops-mobile-app:${{ github.sha }} \
            ntnguyen055/devsecops-mobile-app:${{ steps.docker-tag.outputs.tag }}

      # Push chính image đã được Trivy scan.
      - name: Push Docker image
        run: |
          docker push ntnguyen055/devsecops-mobile-app:${{ steps.docker-tag.outputs.tag }}
          docker push ntnguyen055/devsecops-mobile-app:${{ github.sha }}

  telegram-notification:
    name: Telegram Security Scan Notification
    needs:
      - gitleaks
      - trivy-fs
      - trivy-docker
      - npm-audit
      - sonarqube
      - docker-publish

    runs-on: ubuntu-latest

    # Chỉ thông báo khi push vào main.
    # always() để vẫn gửi FAILED nếu một job security thất bại.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Determine Security Scan status
        id: status
        run: |
          if [[ "${{ needs.gitleaks.result }}" == "failure" || \
                "${{ needs.gitleaks.result }}" == "cancelled" || \
                "${{ needs.trivy-fs.result }}" == "failure" || \
                "${{ needs.trivy-fs.result }}" == "cancelled" || \
                "${{ needs.trivy-docker.result }}" == "failure" || \
                "${{ needs.trivy-docker.result }}" == "cancelled" || \
                "${{ needs.npm-audit.result }}" == "failure" || \
                "${{ needs.npm-audit.result }}" == "cancelled" || \
                "${{ needs.sonarqube.result }}" == "failure" || \
                "${{ needs.sonarqube.result }}" == "cancelled" || \
                "${{ needs.docker-publish.result }}" == "failure" || \
                "${{ needs.docker-publish.result }}" == "cancelled" ]]; then
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
          else
            echo "status=PASSED" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Trivy filesystem report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: trivy-fs-report
          path: telegram-reports/trivy-fs

      - name: Download Trivy image report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: trivy-image-report
          path: telegram-reports/trivy-image

      - name: Download backend npm audit report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: npm-audit-backend-report
          path: telegram-reports/npm-audit-backend

      - name: Download mobile client npm audit report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: npm-audit-client-report
          path: telegram-reports/npm-audit-client

      - name: Send Security Scan status to Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SECURITY_STATUS: ${{ steps.status.outputs.status }}
        run: |
          MESSAGE=$(cat <<EOF
          Security Scan

          Status: ${SECURITY_STATUS}

          Repository: ${GITHUB_REPOSITORY}
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          Actor: ${GITHUB_ACTOR}

          Results:
          • Gitleaks: ${{ needs.gitleaks.result }}
          • Trivy filesystem: ${{ needs.trivy-fs.result }}
          • Trivy image: ${{ needs.trivy-docker.result }}
          • npm audit: ${{ needs.npm-audit.result }}
          • SonarQube SAST: ${{ needs.sonarqube.result }}
          • Docker publish: ${{ needs.docker-publish.result }}
          EOF
          )

          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "text=${MESSAGE}"

      - name: Send security HTML reports to Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          REPORTS=(
            "telegram-reports/npm-audit-backend/npm-audit-backend.html"
            "telegram-reports/npm-audit-client/npm-audit-client.html"
            "telegram-reports/trivy-fs/trivy-fs-report.html"
            "telegram-reports/trivy-image/trivy-image-report.html"
          )

          for REPORT in "${REPORTS[@]}"; do
            if [ -f "$REPORT" ]; then
              echo "Sending report: $REPORT"

              curl --fail --silent --show-error \
                --request POST \
                --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
                --form "document=@${REPORT}"
            else
              echo "Report not found: $REPORT"
            fi
          done