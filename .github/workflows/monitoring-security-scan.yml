name: Monitoring Security Scan

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04

    outputs:
      monitoring: ${{ steps.filter.outputs.monitoring }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          echo "Changed files:"
          git diff --name-only "$BASE" "$HEAD"

          if git diff --name-only "$BASE" "$HEAD" | grep -qE '^monitoring/|^\.github/workflows/monitoring-security-scan\.yml$'; then
            echo "monitoring=true" >> "$GITHUB_OUTPUT"
          else
            echo "monitoring=false" >> "$GITHUB_OUTPUT"
          fi

  gitleaks:
    name: Secret Scanning (Gitleaks)
    needs: changes
    if: needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-config:
    name: Configuration Scan (Trivy)
    needs: changes
    if: needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: monitoring
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

  trivy-images:
    name: Monitoring Image Scan (Trivy)
    needs: changes
    if: needs.changes.outputs.monitoring == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan Prometheus
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: prom/prometheus:v3.14.0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Scan Grafana
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: grafana/grafana:13.2.2
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Scan Node Exporter
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: prom/node-exporter:v1.12.1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Scan Docker Exporter
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/dlepaux/docker-exporter:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table