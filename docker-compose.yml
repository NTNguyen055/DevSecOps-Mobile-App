version: '3.8'

services:
  # 1. PostgreSQL Database Container
  postgres_db:
    image: postgres:16-alpine
    container_name: devsecops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Fullstack Application Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devsecops-ecommerce-app
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_ORIGIN: http://localhost:4001
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  pgdata:
