services:
  app:
    image: ${DOCKER_IMAGE}

    container_name: devsecops-api
    restart: unless-stopped

    ports:
      - "4001:4001"

    environment:
      PORT: 4001
      NODE_ENV: production

      AWS_REGION: ${AWS_REGION}

      RDS_SECRET_ID: ${RDS_SECRET_ID}
      JWT_SECRET_ID: ${JWT_SECRET_ID}

      RDS_HOST: ${RDS_HOST}
      RDS_PORT: ${RDS_PORT:-5432}
      RDS_DATABASE: ${RDS_DATABASE}

      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-*}

    command: ["node", "scripts/start-production.js"]

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4001/health/db', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    networks:
      - app-network

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

    security_opt:
      - no-new-privileges:true

networks:
  app-network:
    driver: bridge
