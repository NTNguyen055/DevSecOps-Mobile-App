# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name devsecops-mobile.duckdns.org;

    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name devsecops-mobile.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/devsecops-mobile.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devsecops-mobile.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
