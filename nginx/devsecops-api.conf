# API upstream — two Docker replicas on the EC2 host.
# Round Robin is the default Nginx balancing method.
upstream devsecops_api_backend {
    server 127.0.0.1:4001 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:4002 max_fails=1 fail_timeout=10s;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name devsecops-mobile.duckdns.org;

    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name devsecops-mobile.duckdns.org;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    ssl_certificate /etc/letsencrypt/live/devsecops-mobile.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devsecops-mobile.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://devsecops_api_backend;
        proxy_http_version 1.1;

        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
