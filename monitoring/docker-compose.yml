services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: monitoring-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - node-exporter
      - docker-exporter

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: monitoring-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"

  docker-exporter:
    image: ghcr.io/dlepaux/docker-exporter:latest
    container_name: monitoring-docker-exporter
    restart: unless-stopped
    group_add:
      - "113"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:9713:9713"

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter@sha256:9613f2884689b6fad9f1939f6a3b0388c93a022cfaededb19545b329b5c83dea
    container_name: monitoring-blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "127.0.0.1:9115:9115"

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: monitoring-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    secrets:
      - monitoring_webhook_token
    group_add:
      - "24000"

  grafana:
    image: grafana/grafana:13.2.3
    container_name: monitoring-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  telegram-notifier:
    build:
      context: ./telegram-notifier
    container_name: monitoring-telegram-notifier
    restart: unless-stopped
    environment:
      AWS_REGION: ap-southeast-1
      SECRET_ID: devsecops-monitoring/telegram
    secrets:
      - monitoring_webhook_token
    group_add:
      - "24000"

volumes:
  prometheus-data:
  grafana-data:

secrets:
  monitoring_webhook_token:
    file: ./secrets/monitoring_webhook_token
