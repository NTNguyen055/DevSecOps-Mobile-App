global:
  resolve_timeout: 5m

route:
  receiver: monitoring-telegram
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: monitoring-telegram
    webhook_configs:
      - url: http://telegram-notifier:8080/webhook
        send_resolved: true
