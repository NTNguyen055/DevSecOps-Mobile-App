
rule_files:
  - /etc/prometheus/rules/container-alerts.yml

evaluation_interval: 1m

tests:
  # TEST 1: Replica 1 stops; Replica 2 remains healthy.
  - interval: 1m
    input_series:
      - series: 'up{job="docker-exporter",instance="docker-exporter:9713"}'
        values: '1+0x5'

      - series: 'container_state{name="devsecops-api",state="running"}'
        values: '0+0x5'

      - series: 'container_state{name="devsecops-api-2",state="running"}'
        values: '1+0x5'

      - series: 'app_deployment_expected_replicas{job="application-security",instance="devsecops-api:9464"}'
        values: '2+0x5'

    alert_rule_test:
      # Not firing before the 2-minute threshold.
      - eval_time: 1m
        alertname: DevSecOpsAPIDown
        exp_alerts: []

      # Replica 1 must trigger a critical alert.
      - eval_time: 3m
        alertname: DevSecOpsAPIDown
        exp_alerts:
          - exp_labels:
              name: devsecops-api
              state: running
              severity: critical
            exp_annotations:
              summary: "devsecops-api container is down"
              description: "The devsecops-api container has not been running for more than 2 minutes."

      # Replica 2 must not trigger a false alert.
      - eval_time: 3m
        alertname: DevSecOpsAPIReplica2Down
        exp_alerts: []

  # TEST 2: Replica 2 disappears from Docker Exporter.
  - interval: 1m
    input_series:
      - series: 'up{job="docker-exporter",instance="docker-exporter:9713"}'
        values: '1+0x5'

      - series: 'container_state{name="devsecops-api",state="running"}'
        values: '1+0x5'

      - series: 'app_deployment_expected_replicas{job="application-security",instance="devsecops-api:9464"}'
        values: '2+0x5'

      - series: 'app_deployment_expected_replicas{job="application-security",instance="devsecops-api-2:9464"}'
        values: '2+0x5'

      # No running-state series for devsecops-api-2.

    alert_rule_test:
      - eval_time: 1m
        alertname: DevSecOpsAPIReplica2Down
        exp_alerts: []

      - eval_time: 3m
        alertname: DevSecOpsAPIReplica2Down
        exp_alerts:
          - exp_labels:
              name: devsecops-api-2
              state: running
              severity: critical
            exp_annotations:
              summary: "devsecops-api-2 container is down"
              description: "The devsecops-api-2 container has not been running for more than 2 minutes."

      - eval_time: 3m
        alertname: DevSecOpsAPIDown
        exp_alerts: []

  # TEST 3: Docker Exporter is down.
  # Container-down alerts must not fire based on missing data.
  - interval: 1m
    input_series:
      - series: 'up{job="docker-exporter",instance="docker-exporter:9713"}'
        values: '0+0x5'

      - series: 'container_state{name="devsecops-api",state="running"}'
        values: '0+0x5'

      - series: 'app_deployment_expected_replicas{job="application-security",instance="devsecops-api:9464"}'
        values: '2+0x5'

    alert_rule_test:
      - eval_time: 3m
        alertname: DevSecOpsAPIDown
        exp_alerts: []

      - eval_time: 3m
        alertname: DevSecOpsAPIReplica2Down
        exp_alerts: []

  # TEST 4: Intentional rollback to one replica.
  # Replica 2 is absent, but expected replicas = 1.
  - interval: 1m
    input_series:
      - series: 'up{job="docker-exporter",instance="docker-exporter:9713"}'
        values: '1+0x5'

      - series: 'container_state{name="devsecops-api",state="running"}'
        values: '1+0x5'

      - series: 'app_deployment_expected_replicas{job="application-security",instance="devsecops-api:9464"}'
        values: '1+0x5'

    alert_rule_test:
      - eval_time: 3m
        alertname: DevSecOpsAPIReplica2Down
        exp_alerts: []

      - eval_time: 3m
        alertname: DevSecOpsAPIDown
        exp_alerts: []

  # TEST 5: Rollback to an older image without the Gauge.
  # No false Replica 2 alert should be generated.
  - interval: 1m
    input_series:
      - series: 'up{job="docker-exporter",instance="docker-exporter:9713"}'
        values: '1+0x5'

      - series: 'container_state{name="devsecops-api",state="running"}'
        values: '1+0x5'

      # No Replica 2 state and no deployment Gauge.

    alert_rule_test:
      - eval_time: 3m
        alertname: DevSecOpsAPIReplica2Down
        exp_alerts: []

      - eval_time: 3m
        alertname: DevSecOpsAPIDown
        exp_alerts: []

  # TEST 6: Replica 2 exists but has stopped unexpectedly.
  - interval: 1m
    input_series:
      - series: 'up{job="docker-exporter",instance="docker-exporter:9713"}'
        values: '1+0x5'

      - series: 'container_state{name="devsecops-api",state="running"}'
        values: '1+0x5'

      - series: 'container_state{name="devsecops-api-2",state="running"}'
        values: '0+0x5'

      - series: 'app_deployment_expected_replicas{job="application-security",instance="devsecops-api:9464"}'
        values: '2+0x5'

    alert_rule_test:
      - eval_time: 1m
        alertname: DevSecOpsAPIReplica2Down
        exp_alerts: []

      - eval_time: 3m
        alertname: DevSecOpsAPIReplica2Down
        exp_alerts:
          - exp_labels:
              name: devsecops-api-2
              state: running
              severity: critical
            exp_annotations:
              summary: "devsecops-api-2 container is down"
              description: "The devsecops-api-2 container has not been running for more than 2 minutes."

      - eval_time: 3m
        alertname: DevSecOpsAPIDown
        exp_alerts: []
