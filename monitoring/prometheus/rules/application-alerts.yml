groups:
  - name: application-availability
    rules:

      - alert: ApplicationDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Application is down"
          description: "The application health endpoint has been unreachable for more than 1 minute."

      - alert: ApplicationHTTPError
        expr: probe_http_status_code{job="blackbox-http"} >= 400
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Application HTTP error"
          description: "The application health endpoint is returning HTTP {{ $value }}."

      - alert: ApplicationHighResponseTime
        expr: probe_duration_seconds{job="blackbox-http"} > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Application response time is high"
          description: "The application health endpoint response time has exceeded 1 second for more than 2 minutes."

      - alert: TLSCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) < 30 * 24 * 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate is expiring soon"
          description: "The TLS certificate for the application expires in less than 30 days."
